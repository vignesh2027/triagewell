[project]
name = "triagewell"
version = "0.1.0"
description = "Issue triage for open-source maintainers, run through the Otari gateway on open-weight models."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Vignesh S" }]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.9.0",
    "starlette>=0.46.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
triagewell = "triagewell.cli:main"

[dependency-groups]
dev = ["pytest>=8.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagewell"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
