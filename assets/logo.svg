<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t">
  <title id="t">Triagewell</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <!-- three incoming issues of different lengths, sorted into one stream -->
  <rect x="96" y="128" width="248" height="40" rx="20" fill="#FFFFFF"/>
  <rect x="96" y="200" width="184" height="40" rx="20" fill="#FFFFFF" opacity="0.85"/>
  <rect x="96" y="272" width="120" height="40" rx="20" fill="#FFFFFF" opacity="0.7"/>
  <!-- the well: a ring that the sorted issue settles into -->
  <circle cx="352" cy="344" r="92" fill="#4C1D95"/>
  <circle cx="352" cy="344" r="92" fill="none" stroke="#FFFFFF" stroke-width="16"/>
  <path d="M308 346 L338 376 L398 312" fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
